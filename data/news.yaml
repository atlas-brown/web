items:
  - |
      Jul'26: At [OSDI'26](https://www.usenix.org/conference/osdi26), [try](https://atlas.cs.brown.edu/pdf/try:osdi:2026.pdf) receives a Jay Lepreau Best Paper Award _and_ a Best Artifact Award, while [RT](https://atlas.cs.brown.edu/pdf/rt:osdi:2026.pdf) is selected as a Best Paper runner-up!
  - |
      Jul'26: [Sash](https://github.com/atlas-brown/sash), a new [ahead-of-time analysis of shell program effects](https://atlas.cs.brown.edu/pdf/sash:sosp:2026.pdf), to appear at [SOSP'26](https://sigops.org/s/conferences/sosp/2026/)---see you in Prague!
  - |
      Jul'26: Nikos Vasilakis receives an NSF CAREER award on automating whole-systems transformations with [Transformorphic Computing](https://www.nsf.gov/awardsearch/show-award?AWD_ID=2541584)!
  - |
      May'26: Four [OSDI'26](https://www.usenix.org/conference/osdi26) papers on [bolt-on incrementalization](https://atlas.cs.brown.edu/pdf/incr:osdi:2026.pdf) with [Incr](https://github.com/atlas-brown/incr), on [opaque-component effect control](https://atlas.cs.brown.edu/pdf/try:osdi:2026.pdf) with [try](https://github.com/binpash/try), on [speculative execution for shell and Python programs](https://atlas.cs.brown.edu/pdf/hs:osdi:2026.pdf) with [hs](https://github.com/binpash/hs), and on [a regex-based type system for the Unix shell](https://atlas.cs.brown.edu/pdf/rt:osdi:2026.pdf)---see you in Seattle!
  - |
      Apr'26: Extensions to [the Koala benchmarks](https://atlas.cs.brown.edu/pdf/koala:tocs:2026.pdf) invited to [ACM TOCS](https://tocs.acm.org/), following a recommendation by the [USENIX ATC'25](https://www.usenix.org/conference/atc25) chairs.
  - |
      Apr'26: New approaches on securing agentic environments, [internally](https://atlas.cs.brown.edu/pdf/haven:euromlsys:2026.pdf) (at [EuroMLSys'26](https://euromlsys.eu/)) and [externally](https://atlas.cs.brown.edu/pdf/samos:brown:2026.pdf) (Sc.M. thesis)!
  - |
      Mar'26: [Apply](https://brown-systems-week.github.io/) to attend the 2026 Brown Systems Week in beautiful Providence, RI!
  - |
      Feb'26: [Jiayi Wu](https://jiayiw005.github.io/) and [Kaitlyn Cheng](https://www.linkedin.com/in/kaitlyn-h-cheng/) join the group as [UTRAs](https://utra.brown.edu/)!
  - |
      Jan'26: Two new pre-prints on LLM-assisted [specification mining for opaque components](https://arxiv.org/abs/2510.14279) and [secure program regeneration](https://arxiv.org/abs/2510.14522).
  - |
      Jan'26: We are organizing a tutorial on [Analyzing Shell Scripts](https://popl26.sigplan.org/details/POPL-2026-tutorials/3/Analyzing-Shell-Scripts) at [POPL'26](https://conf.researchr.org/home/POPL-2026)—join us in Rennes, France!
  - |
      Sep'25: Early ideas on [LLM guardrails](https://nikos.vasilak.is/p/exo:pacmi:2025.pdf), [hybrid scheduling](https://nikos.vasilak.is/p/cocoon:plos:2025.pdf), and [verifiable kernel extensions](https://nikos.vasilak.is/p/klean:plos:2025.pdf) at [SOSP'25 workshops](https://sigops.org/s/conferences/sosp/2025/workshops.html)!
  - |
      Aug'25: Two [NSDI'26](https://www.usenix.org/conference/nsdi26) papers on [optimization prediction](https://github.com/atlas-brown/slowpoke) and [fault tolerance](https://github.com/binpash/fractal) for opaque distributed systems!
  - |
      Jul'25: Our [benchmark suite for the shell](https://nikos.vasilak.is/p/koala:atc:2025.pdf) received the [Best Paper Award](https://www.usenix.org/conferences/best-papers) at [USENIX ATC'25](https://www.usenix.org/conference/atc25)!
  - |
      Jul'25: Our group received a [Google ML-and-Systems Junior Faculty](https://blog.google/products/google-cloud/ml-systems-junior-faculty-awards/) Award on [Securing Open-Source Software](/supply-chain/)!  
  - |
      Jul'25: [Evangelos Lamprou](https://vagos.lamprou.xyz/) joins the group for his PhD!  
  - |
      Jun'25: The [Koala benchmarks](https://kben.sh/) was accepted at USENIX [ATC'25](https://www.usenix.org/conference/atc25/presentation/lamprou)!
  - |
      May'25: [Grigorios Ntousakis](https://www.ntousakis.com/) started his internship at IBM research! \
  - |
      Apr'25: [Apply](https://forms.gle/zL2giouQjeKyfcGR6) to attend the [Brown Systems Week 2025](https://brown-systems-week.github.io/)!  
  - |
      Mar'25: Our paper on [semantics-driven static analysis for the shell](https://nikos.vasilak.is/p/sash:hotos:2025.pdf) made it to [HotOS'25](https://sigops.org/s/conferences/hotos/2025/)!  
  - |
      Mar'25: Received an [Amazon Research Award (ARA)](https://www.amazon.science/research-awards/program-updates/70-amazon-research-award-recipients-announced) on Automated Reasoning for the Unix/Linux shell!  
  - |
      Jan'25: [Nikos Vasilakis](https://nikos.vasilak.is) is organizing [EuroSec'25](https://eurosec-workshop.github.io/), co-located with [EuroSys'25](https://2025.eurosys.org/) and [ASPLOS'25](https://www.asplos-conference.org/asplos2025/).  
  - |
      Dec'24: [Eric Zhao](https://mustardfox.org/) discusses the intricacies of symbolic execution for the shell at [NJPLS'24](https://njpls.org/).  
  - |
      Oct'24: [Anirudh Narsipur](https://anarsipur.com/) discusses static analysis for the Unix shell at [NEPLS'24](https://nepls.org/Events/34/).  
  - |
      Aug'24: [Lukas Lazarek](https://llazarek.github.io/) and [Di Jin](https://sleepymug.me/) join the group as postdoctoral associates—welcome!  
  - |
      Jul'24: [Eric Zhao](https://mustardfox.org/), [Ethan Lavi](https://ethanlavi.github.io/), [Grigorios Ntousakis](https://www.ntousakis.com/), and [Yuchen Lu](https://www.linkedin.com/in/luyc/) join the group for their PhDs!  
  - |
      Jun'24: [Ioanna Gemou](https://igemou.github.io/) starts her research visit on machine learning for systems, co-hosted by [Ritambhara Singh](https://ritambharasingh.com/).  
  - |
      Jan'24: [Evangelos Lamprou](https://vagos.lamprou.xyz/) starts his research visit on parallel, distributed, and secure systems.  
  - |
      Dec'23: [Nikos Vasilakis](https://nikos.vasilak.is) is co-chairing the PC of [EuroSec'24](https://secopera.eu/eurosec-2024/), co-located with [EuroSys](https://2024.eurosys.org/).  
  - |
      Oct'23: We're hosting the [3rd PaSh Research Workshop](https://docs.google.com/document/d/1sAwonBVJr4tCBQdaoXGRAr5R4pi-Jw7Oumf_VQg-nQs) at Brown University.  
  - |
      Sep'23: [Nikos Pagonas](https://nikpag.github.io/) joins the group for a six-month visit on serverless computing.  
  - |
      Sep'23: Brown CS News published [an article on our ACM AsiaCCS'23 distinguished paper award](https://awards.cs.brown.edu/2023/09/26/ntousakis-kemerlis-vasilakis-and-collaborators-win-the-acm-asiaccs-23-distinguished-paper-award/)!  
  - |
      Aug'23: [Anirudh Narsipur](https://www.anarsipur.com/) and [Seth Sabar](https://www.linkedin.com/in/sethsabar/) start their undergraduate dissertations.  
  - |
      Jul'23: [Oğuzhan Çölkesen](https://www.oguzhancolkesen.com/) and [Yizheng Xie](https://yizhengx.github.io/) join the group for their PhD.  
  - |
      Jun'23: [Nikos Vasilakis](https://nikos.vasilak.is) is co-chairing [ACM SCORED'23](https://scored.dev), a workshop co-located with [ACM CCS'23](https://www.sigsac.org/ccs/CCS2023/).   
  - |
      Jun'23: [BinWrap](https://nikos.vasilak.is/p/binwrap:asiaccs:2023.pdf) to receive the distinguished-paper award at [AsiaCCS'23](https://asiaccs2023.org/)!  
  - |
      Jun'23: [Zhicheng Huang](https://huangworld.github.io/) joins the group to work on DiSh.      
  - |
      May'23: [hs](https://nikos.vasilak.is/p/hs:hotos:2023.pdf), the out-of-order, speculative-execution PaSh extensions made it [HotOS'23](https://sigops.org/s/conferences/hotos/2023/).  
  - |
      Apr'23: [Julian Dai](https://jdai1.github.io/) joins the group to research supply-chain security.  
  - |
      Mar'23: [BinWrap](http://nikos.vasilak.is/p/binwrap:asiaccs:2023.pdf), a language-binary protection hybrid for native add-ons made it to [AsiaCCS'23](https://asiaccs2023.org/).   
  - |
      Mar'23: [Grigorios Ntousakis](https://www.ntousakis.com) joins the group for a 9-month research visit.   
  - |
      Feb'23: [Seong-Heon Jung](https://forthoney.github.io/) joins the group to work on PaSh.      
  - |
      Jan'23: [DiSh](http://nikos.vasilak.is/p/pash:nsdi:2023.pdf), the dynamic shell-script distribution extensions to [PaSh](https://github.com/binpash), made it to [NSDI'23](https://www.usenix.org/conference/nsdi23)!  
  - |
      Dec'22: [SecBench.js](http://nikos.vasilak.is/p/secbench:icse:2023.pdf), a security benchmark suite for JavaScript, made it to [ICSE'23](https://conf.researchr.org/home/icse-2023)!  
  - |
      Nov'22: [Pitchfork](http://nikos.vasilak.is/p/pitchfork:acsac:2022.pdf), an application-level privilege-separation [system](http://pitchfork.cs.iit.edu/), was accepted to [ACSAC'22](https://www.acsac.org/2022/program/)!  
  - |
      Jun'22: MIT News covered our work on PaSh: [Faster computing results without fear of errors](https://news.mit.edu/2022/faster-unix-computing-program-0607)!
